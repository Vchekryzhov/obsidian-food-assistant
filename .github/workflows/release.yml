name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches manifest
        run: test "${GITHUB_REF_NAME}" = "$(node -p "require('./manifest.json').version")"
      - name: Package release
        run: zip food-assistant-module-${GITHUB_REF_NAME}.zip main.js manifest.json styles.css
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            food-assistant-module-${{ github.ref_name }}.zip
